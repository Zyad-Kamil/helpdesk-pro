spring.application.name=helpdesk-pro
server.port=8080

# H2 database paths, without the ".mv.db" suffix, relative to the project root.
# The demo database is copied to the runtime path on first start (see DemoDatabaseInstaller).
helpdesk.database.demo-path=./data/demo/helpdesk
helpdesk.database.runtime-path=./data/runtime/helpdesk

# Spring closes the database itself on shutdown, hence DB_CLOSE_ON_EXIT=FALSE.
spring.datasource.url=jdbc:h2:file:${helpdesk.database.runtime-path};DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# "update" creates missing tables and columns and never drops existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
