<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout(~{::title}, 'technicians', ~{::main})}">
<head>
	<title th:text="${editing} ? 'Modifier le profil – HelpDesk Pro' : 'Nouveau profil – HelpDesk Pro'">Profil</title>
</head>
<body>
<main>
	<nav aria-label="Fil d'Ariane" class="mb-2 small">
		<a th:href="@{/technicians/{id}(id=${technician.id()})}" th:text="${technician.firstName() + ' ' + technician.lastName()}">Technicien</a>
	</nav>
	<div class="hp-page-header">
		<h1 th:text="${editing} ? 'Modifier le profil' : 'Créer le profil'">Profil</h1>
	</div>
	<div class="card">
		<div class="card-body">
			<form th:action="${editing} ? @{/technicians/{id}/profile/edit(id=${technician.id()})} : @{/technicians/{id}/profile(id=${technician.id()})}"
				th:object="${form}" method="post" novalidate>
				<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
					<div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erreur</div>
				</div>
				<p class="hp-muted">Tous les champs sont facultatifs.</p>
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label" for="phone">Téléphone</label>
						<input class="form-control" id="phone" th:field="*{phone}" th:errorclass="is-invalid" maxlength="30">
						<div class="invalid-feedback" th:errors="*{phone}">Erreur</div>
					</div>
					<div class="col-md-6">
						<label class="form-label" for="specialization">Spécialisation</label>
						<input class="form-control" id="specialization" th:field="*{specialization}" th:errorclass="is-invalid"
							maxlength="100">
						<div class="invalid-feedback" th:errors="*{specialization}">Erreur</div>
					</div>
					<div class="col-12">
						<label class="form-label" for="biography">Biographie</label>
						<textarea class="form-control" id="biography" rows="5" th:field="*{biography}" th:errorclass="is-invalid"></textarea>
						<div class="invalid-feedback" th:errors="*{biography}">Erreur</div>
					</div>
				</div>
				<div class="d-flex gap-2 mt-4">
					<button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Enregistrer</button>
					<a class="btn btn-outline-secondary" th:href="@{/technicians/{id}(id=${technician.id()})}">Annuler</a>
				</div>
			</form>
		</div>
	</div>
</main>
</body>
</html>
