<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout(~{::title}, 'technicians', ~{::main})}">
<head>
	<title th:text="${editing} ? 'Modifier le technicien – HelpDesk Pro' : 'Nouveau technicien – HelpDesk Pro'">Technicien</title>
</head>
<body>
<main>
	<div class="hp-page-header">
		<h1 th:text="${editing} ? 'Modifier le technicien' : 'Nouveau technicien'">Technicien</h1>
	</div>
	<div class="card">
		<div class="card-body">
			<form th:action="${editing} ? @{/technicians/{id}/edit(id=${technicianId})} : @{/technicians}"
				th:object="${form}" method="post" novalidate>
				<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
					<div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erreur</div>
				</div>
				<div class="row g-3">
					<div class="col-md-6">
						<label class="form-label hp-required" for="firstName">Prénom</label>
						<input class="form-control" id="firstName" th:field="*{firstName}" th:errorclass="is-invalid" maxlength="80">
						<div class="invalid-feedback" th:errors="*{firstName}">Erreur</div>
					</div>
					<div class="col-md-6">
						<label class="form-label hp-required" for="lastName">Nom</label>
						<input class="form-control" id="lastName" th:field="*{lastName}" th:errorclass="is-invalid" maxlength="80">
						<div class="invalid-feedback" th:errors="*{lastName}">Erreur</div>
					</div>
					<div class="col-12">
						<label class="form-label hp-required" for="email">E-mail</label>
						<input class="form-control" id="email" type="email" th:field="*{email}" th:errorclass="is-invalid"
							maxlength="255">
						<div class="invalid-feedback" th:errors="*{email}">Erreur</div>
					</div>
				</div>
				<div class="d-flex gap-2 mt-4">
					<button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Enregistrer</button>
					<a class="btn btn-outline-secondary"
						th:href="${editing} ? @{/technicians/{id}(id=${technicianId})} : @{/technicians}">Annuler</a>
				</div>
			</form>
		</div>
	</div>
</main>
</body>
</html>
