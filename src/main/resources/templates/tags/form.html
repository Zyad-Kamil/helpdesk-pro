<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{fragments/layout :: layout(~{::title}, 'tags', ~{::main})}">
<head>
	<title th:text="${editing} ? 'Modifier le tag – HelpDesk Pro' : 'Nouveau tag – HelpDesk Pro'">Tag</title>
</head>
<body>
<main>
	<div class="hp-page-header">
		<h1 th:text="${editing} ? 'Modifier le tag' : 'Nouveau tag'">Tag</h1>
	</div>
	<div class="card">
		<div class="card-body">
			<form th:action="${editing} ? @{/tags/{id}/edit(id=${tagId})} : @{/tags}" th:object="${form}" method="post"
				novalidate>
				<div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
					<div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erreur</div>
				</div>
				<div class="mb-3">
					<label class="form-label hp-required" for="name">Nom</label>
					<input class="form-control" id="name" th:field="*{name}" th:errorclass="is-invalid" maxlength="50">
					<div class="invalid-feedback" th:errors="*{name}">Erreur</div>
				</div>
				<div class="d-flex gap-2 mt-4">
					<button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Enregistrer</button>
					<a class="btn btn-outline-secondary" th:href="${editing} ? @{/tags/{id}(id=${tagId})} : @{/tags}">Annuler</a>
				</div>
			</form>
		</div>
	</div>
</main>
</body>
</html>
